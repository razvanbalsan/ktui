name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - run: go test ./...

      - name: build archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          make dist VERSION="$VERSION"

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release cut by hand already carries the archives the published
          # formula checksums were taken from. Never overwrite those: rebuilding
          # here would produce different bytes and break `brew install`.
          if gh release view "$GITHUB_REF_NAME" --json assets \
               -q '.assets[].name' 2>/dev/null | grep -q '\.tar\.gz$'; then
            echo "release $GITHUB_REF_NAME already has archives; leaving them in place"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt

      - name: formula for the tap
        run: |
          {
            echo '## Homebrew formula'
            echo
            echo 'Copy into `razvanbalsan/homebrew-tap` at `Formula/ktui.rb`:'
            echo
            echo '```ruby'
            sh hack/formula.sh "$VERSION" "$GITHUB_REPOSITORY" dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
