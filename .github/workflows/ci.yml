name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: verify it builds for every release target
        run: |
          for p in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} go build -trimpath -o /dev/null .
          done
